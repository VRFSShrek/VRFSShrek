<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VRFSIL | ליגת העל</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
:root {
    --bg-dark: #0f172a;
    --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
    --card-bg: rgba(30, 41, 59, 0.7);
    --card-border: rgba(255, 255, 255, 0.1);
    --accent: #10b981;
    --primary: #3b82f6;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --danger: #ef4444;
}
* { box-sizing: border-box; margin:0; padding:0; }
body { font-family:'Heebo',sans-serif; background: var(--bg-gradient); color: var(--text); min-height:100vh; padding-bottom:40px; }

header {
    position: sticky; top:0; z-index:100;
    background: rgba(15,23,42,0.9); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--card-border); padding: 15px 20px;
    display:flex; justify-content: space-between; align-items:center;
}
header h1 {
    font-size:24px; font-weight:900;
    background: linear-gradient(to left, var(--accent), var(--primary));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
nav { display:flex; gap:8px; background: rgba(255,255,255,0.05); padding:5px; border-radius:12px; }
nav button {
    padding:8px 16px; border-radius:8px; border:none; background:transparent;
    color: var(--text-muted); font-weight:500; cursor:pointer; transition:0.3s;
}
nav button.active { background: var(--card-bg); color: var(--accent); font-weight:700; }

.container { max-width:1100px; margin:30px auto; padding:0 20px; display:flex; flex-direction:column; gap:25px; }

.card {
    background: var(--card-bg); backdrop-filter: blur(16px);
    border:1px solid var(--card-border); border-radius:24px; padding:30px;
    box-shadow:0 10px 30px -10px rgba(0,0,0,0.5);
}

h2 { margin-bottom:20px; font-weight:800; border-right:4px solid var(--accent); padding-right:15px; }

.table { width:100%; border-collapse:collapse; text-align:center; }
.table th { color: var(--accent); padding:15px; border-bottom: 2px solid var(--card-border); }
.table td { padding:15px; border-bottom: 1px solid var(--card-border); }

.admin-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap:20px; margin-top:20px; }
.admin-item { background: rgba(0,0,0,0.3); padding:20px; border-radius:16px; border: 1px solid var(--card-border); }

input, select { width:100%; padding:12px; margin-bottom:10px; border-radius:12px; border:1px solid var(--card-border); background: rgba(0,0,0,0.4); color:white; }

.btn { padding:10px 20px; border-radius:12px; border:none; cursor:pointer; font-weight:700; transition:0.3s; font-family:'Heebo'; }
.btn.green { background: var(--accent); color:#064e3b; }
.btn.blue { background: var(--primary); color:white; }
.btn.red { background: var(--danger); color:white; }

.tweet-card { position: relative; background: rgba(255,255,255,0.03); padding:15px; border-radius:16px; border-right:3px solid var(--primary); margin-bottom:10px; }
.delete-btn { position: absolute; left: 10px; top: 10px; cursor: pointer; color: var(--danger); font-size: 12px; }

#loginModal {
    display:none; position:fixed; top:0; left:0; width:100%; height:100%;
    background: rgba(0,0,0,0.8); z-index:1000; justify-content:center; align-items:center;
}
.modal-content { background:#1e293b; padding:40px; border-radius:24px; width:400px; display:flex; flex-direction:column; gap:15px; position:relative; }

@media(max-width:768px){ header { flex-direction:column; gap:10px; } }
</style>
</head>
<body>

<header>
    <h1>VRFSIL</h1>
    <nav>
        <button id="tabTable" class="active" onclick="showTab('table')">טבלה</button>
        <button id="tabLive" onclick="showTab('live')">משחקים</button>
        <button id="tabFeed" onclick="showTab('feed')">Feed</button>
    </nav>
    <div id="userHeaderArea">
        <button id="loginBtn" class="btn blue" onclick="openLogin()">התחברות / הרשמה</button>
        <span id="loggedUser" style="color:var(--accent);display:none;font-weight:700;margin-left:10px;"></span>
        <button id="logoutBtn" class="btn red" style="display:none; padding:5px 10px; font-size:12px;" onclick="logout()">התנתק</button>
    </div>
</header>

<div class="container">
    <div id="tabContent">
        <div id="table" class="card">
            <h2>טבלת הליגה</h2>
            <table class="table" id="leagueTable"></table>
        </div>

        <div id="live" class="card" style="display:none">
            <h2>משחקים פעילים</h2>
            <div id="liveMatches"></div>
        </div>

        <div id="feed" class="card" style="display:none">
            <h2>Feed הקהילה</h2>
            <div id="feedInputArea" style="display:none;">
                <textarea id="tweetInput" placeholder="מה קורה בליגה?" style="width:100%; background:rgba(0,0,0,0.2); border:1px solid var(--card-border); border-radius:12px; padding:15px; color:white; margin-bottom:10px; resize:none;"></textarea>
                <button class="btn blue" onclick="postTweet()">פרסם</button>
            </div>
            <div id="feedGuestMsg" style="color:var(--text-muted); text-align:center; padding:20px;">יש להתחבר כדי לכתוב בפיד</div>
            <div id="tweetFeed" style="margin-top:20px;"></div>
        </div>
    </div>

    <div class="card admin" id="adminPanel" style="display:none; border: 2px solid var(--accent);">
        <h2 style="color: var(--accent);">פאנל שליטה אדמין</h2>
        <div class="admin-grid">
            <div class="admin-item">
                <h3>ניהול ניקוד</h3>
                <select id="teamSelect"></select>
                <input type="number" id="pointsUpdate" placeholder="כמות נקודות">
                <button class="btn green" style="width:100%" onclick="updatePoints()">עדכן טבלה</button>
            </div>
            <div class="admin-item">
                <h3>ניהול משחקים</h3>
                <div id="adminLiveList" style="margin-bottom:10px; font-size:14px;"></div>
                <input id="homeT" placeholder="בית">
                <input id="awayT" placeholder="חוץ">
                <input id="scoreT" placeholder="0-0">
                <button class="btn blue" style="width:100%" onclick="addLive()">הוסף משחק</button>
            </div>
        </div>
    </div>
</div>

<div id="loginModal">
    <div class="modal-content">
        <button style="position:absolute; top:10px; left:10px; background:none; border:none; color:white; cursor:pointer;" onclick="closeLogin()">X</button>
        <h2 id="modalTitle">התחברות</h2>
        <input type="text" id="modalUsername" placeholder="שם משתמש">
        <input type="password" id="modalPassword" placeholder="סיסמה">
        <button class="btn green" id="mainAuthBtn" onclick="login()">התחבר</button>
        <button class="btn blue" id="switchAuthBtn" onclick="toggleAuthMode()">אין לך חשבון? הירשם עכשיו</button>
    </div>
</div>

<script>
// נתונים ראשוניים
let teams = JSON.parse(localStorage.getItem('vrfsil_teams')) || [
    {name:"מכבי פתח תקווה", pts:0}, {name:"הפועל באר שבע", pts:0}, 
    {name:"מ.ס אשדוד", pts:0}, {name:"מכבי באר שבע", pts:0},
    {name:"מכבי תל אביב", pts:0}, {name:"מכבי חיפה", pts:0}, 
    {name:"הפועל תל אביב", pts:0}, {name:"בית'ר ברוקולי", pts:0}
];
let users = JSON.parse(localStorage.getItem('vrfsil_users')) || [
    {username:"ADMINShrek", password:"ShrekKAPLAN", isAdmin:true}
];
let live = [];
let tweets = [];
let currentUser = null;
let isLoginMode = true;

function renderAll() {
    renderTable();
    renderLive();
    renderTweets();
    if(currentUser) {
        document.getElementById("loginBtn").style.display = "none";
        document.getElementById("loggedUser").style.display = "inline";
        document.getElementById("loggedUser").innerText = "שלום, " + currentUser.username;
        document.getElementById("logoutBtn").style.display = "inline";
        document.getElementById("feedInputArea").style.display = "block";
        document.getElementById("feedGuestMsg").style.display = "none";
        if(currentUser.isAdmin) document.getElementById("adminPanel").style.display = 'block';
        renderAdminControls();
    } else {
        document.getElementById("loginBtn").style.display = "inline";
        document.getElementById("loggedUser").style.display = "none";
        document.getElementById("logoutBtn").style.display = "none";
        document.getElementById("adminPanel").style.display = 'none';
        document.getElementById("feedInputArea").style.display = "none";
        document.getElementById("feedGuestMsg").style.display = "block";
    }
    saveToStorage();
}

function renderTable() {
    teams.sort((a,b) => b.pts - a.pts);
    let html = `<tr><th>מיקום</th><th>קבוצה</th><th>נקודות</th></tr>`;
    teams.forEach((t, i) => {
        html += `<tr><td>${i+1}</td><td>${t.name}</td><td style="color:var(--accent); font-weight:bold;">${t.pts}</td></tr>`;
    });
    document.getElementById("leagueTable").innerHTML = html;
    document.getElementById("teamSelect").innerHTML = teams.map(t => `<option value="${t.name}">${t.name}</option>`).join('');
}

function renderLive() {
    let html = live.length ? "" : "<p style='text-align:center; opacity:0.5;'>אין משחקים כרגע</p>";
    live.forEach(m => {
        html += `<div style="display:grid; grid-template-columns:1fr auto 1fr; align-items:center; background:rgba(0,0,0,0.2); padding:15px; border-radius:12px; margin-bottom:10px; border:1px solid var(--card-border);">
            <span style="text-align:left">${m.home}</span>
            <span style="background:#000; padding:5px 15px; border-radius:5px; color:var(--accent); margin:0 15px; font-family:monospace;">${m.score}</span>
            <span style="text-align:right">${m.away}</span>
        </div>`;
    });
    document.getElementById("liveMatches").innerHTML = html;
}

function renderAdminControls() {
    let html = "";
    live.forEach((m, i) => {
        html += `<div style="display:flex; justify-content:space-between; background:rgba(255,255,255,0.05); padding:8px; margin-bottom:5px; border-radius:8px; font-size:12px;">
            <span>${m.home} - ${m.away}</span>
            <button class="btn red" style="padding:2px 5px;" onclick="deleteLive(${i})">X</button>
        </div>`;
    });
    document.getElementById("adminLiveList").innerHTML = html;
}

function renderTweets() {
    let html = "";
    tweets.forEach((t, i) => {
        html += `<div class="tweet-card">
            ${currentUser?.isAdmin ? `<span class="delete-btn" onclick="deleteTweet(${i})">מחק 🗑️</span>` : ''}
            <div style="font-weight:bold; color:var(--primary);">${t.user}:</div>
            <div>${t.text}</div>
        </div>`;
    });
    document.getElementById("tweetFeed").innerHTML = html;
}

// לוגיקת משתמשים
function openLogin() { document.getElementById("loginModal").style.display = "flex"; }
function closeLogin() { document.getElementById("loginModal").style.display = "none"; }

function toggleAuthMode() {
    isLoginMode = !isLoginMode;
    document.getElementById("modalTitle").innerText = isLoginMode ? "התחברות" : "הרשמה למערכת";
    document.getElementById("mainAuthBtn").innerText = isLoginMode ? "התחבר" : "צור חשבון";
    document.getElementById("mainAuthBtn").onclick = isLoginMode ? login : register;
    document.getElementById("switchAuthBtn").innerText = isLoginMode ? "אין לך חשבון? הירשם עכשיו" : "כבר יש לך חשבון? התחבר";
}

function register() {
    let u = document.getElementById("modalUsername").value.trim();
    let p = document.getElementById("modalPassword").value;
    if(!u || !p) return alert("נא למלא את כל השדות");
    if(users.find(x => x.username === u)) return alert("שם משתמש תפוס");
    
    users.push({username: u, password: p, isAdmin: false});
    alert("נרשמת בהצלחה! עכשיו התחבר");
    toggleAuthMode();
}

function login() {
    let u = document.getElementById("modalUsername").value;
    let p = document.getElementById("modalPassword").value;
    let user = users.find(x => x.username === u && x.password === p);
    
    if(user) {
        currentUser = user;
        closeLogin();
        renderAll();
    } else {
        alert("שם משתמש או סיסמה שגויים");
    }
}

function logout() {
    currentUser = null;
    renderAll();
}

// ניהול תוכן
function updatePoints() {
    let name = document.getElementById("teamSelect").value;
    let val = parseInt(document.getElementById("pointsUpdate").value) || 0;
    let team = teams.find(t => t.name === name);
    if(team) { team.pts += val; renderAll(); document.getElementById("pointsUpdate").value = ""; }
}

function addLive() {
    let h = document.getElementById("homeT").value, a = document.getElementById("awayT").value, s = document.getElementById("scoreT").value;
    if(h && a) { live.push({home: h, away: a, score: s}); renderAll(); }
}

function deleteLive(i) { live.splice(i, 1); renderAll(); }

function postTweet() {
    let txt = document.getElementById("tweetInput").value.trim();
    if(!txt) return;
    tweets.unshift({text: txt, user: currentUser.username});
    document.getElementById("tweetInput").value = "";
    renderAll();
}

function deleteTweet(i) { tweets.splice(i, 1); renderAll(); }

function showTab(tab) {
    ["table", "live", "feed"].forEach(t => document.getElementById(t).style.display = "none");
    document.getElementById(tab).style.display = "block";
    document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
    document.getElementById("tab" + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add("active");
}

function saveToStorage() {
    localStorage.setItem('vrfsil_teams', JSON.stringify(teams));
    localStorage.setItem('vrfsil_users', JSON.stringify(users));
}

// התחלה
renderAll();
</script>
</body>
</html>
