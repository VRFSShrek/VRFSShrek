<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VRFSIL | ליגת העל PRO</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
/* עיצוב */
:root { --bg-dark: #0f172a; --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); --card-bg: rgba(30, 41, 59, 0.7); --card-border: rgba(255, 255, 255, 0.1); --accent: #10b981; --primary: #3b82f6; --text: #f1f5f9; --text-muted: #94a3b8; --danger: #ef4444; }
* { box-sizing: border-box; margin:0; padding:0; }
body { font-family:'Heebo',sans-serif; background: var(--bg-gradient); color: var(--text); min-height:100vh; padding-bottom:40px; }
header { position: sticky; top:0; z-index:100; background: rgba(15,23,42,0.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--card-border); padding: 15px 20px; display:flex; justify-content: space-between; align-items:center; }
header h1 { font-size:24px; font-weight:900; background: linear-gradient(to left, var(--accent), var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
nav { display:flex; gap:8px; background: rgba(255,255,255,0.05); padding:5px; border-radius:12px; }
nav button { padding:8px 16px; border-radius:8px; border:none; background:transparent; color: var(--text-muted); font-weight:500; cursor:pointer; transition:0.3s; }
nav button.active { background: var(--card-bg); color: var(--accent); font-weight:700; }
.container { max-width:1100px; margin:30px auto; padding:0 20px; display:flex; flex-direction:column; gap:25px; }
.card { background: var(--card-bg); backdrop-filter: blur(16px); border:1px solid var(--card-border); border-radius:24px; padding:30px; box-shadow:0 10px 30px -10px rgba(0,0,0,0.5); }
h2 { margin-bottom:20px; font-weight:800; border-right:4px solid var(--accent); padding-right:15px; }
.table { width:100%; border-collapse:collapse; text-align:center; }
.table th { color: var(--accent); padding:15px; border-bottom: 2px solid var(--card-border); }
.table td { padding:15px; border-bottom: 1px solid var(--card-border); }
.admin-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap:20px; margin-top:20px; }
.admin-item { background: rgba(0,0,0,0.3); padding:20px; border-radius:16px; border: 1px solid var(--card-border); }
input, select { width:100%; padding:12px; margin-bottom:10px; border-radius:12px; border:1px solid var(--card-border); background: rgba(0,0,0,0.4); color:white; }
.btn { padding:10px 20px; border-radius:12px; border:none; cursor:pointer; font-weight:700; transition:0.3s; font-family:'Heebo'; }
.btn.green { background: var(--accent); color:#064e3b; }
.btn.blue { background: var(--primary); color:white; }
.btn.red { background: var(--danger); color:white; }
.btn.small { padding: 5px 10px; font-size: 12px; margin-left: 5px; }
.tweet-card { position: relative; background: rgba(255,255,255,0.03); padding:15px; border-radius:16px; border-right:3px solid var(--primary); margin-bottom:10px; }
.delete-btn { position: absolute; left: 10px; top: 10px; cursor: pointer; color: var(--danger); font-size: 12px; }
#loginModal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); z-index:1000; justify-content:center; align-items:center; }
.modal-content { background:#1e293b; padding:40px; border-radius:24px; width:400px; display:flex; flex-direction:column; gap:15px; position:relative; }

/* עיצוב מיוחד לרשימת ניהול משחקים */
.admin-live-row {
    background: rgba(255,255,255,0.05);
    padding: 10px;
    margin-bottom: 8px;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.live-controls {
    display: flex;
    gap: 5px;
    align-items: center;
}
.score-input {
    width: 60px !important;
    text-align: center;
    margin-bottom: 0 !important;
    padding: 5px !important;
}

@media(max-width:768px){ header { flex-direction:column; gap:10px; } }
</style>
</head>
<body>

<header>
    <h1>VRFSIL</h1>
    <nav>
        <button id="tabTable" class="active" onclick="showTab('table')">טבלה</button>
        <button id="tabLive" onclick="showTab('live')">משחקים</button>
        <button id="tabFeed" onclick="showTab('feed')">Feed</button>
    </nav>
    <div id="userHeaderArea">
        <button id="loginBtn" class="btn blue" onclick="openLogin()">התחברות / הרשמה</button>
        <span id="loggedUser" style="color:var(--accent);display:none;font-weight:700;margin-left:10px;"></span>
        <button id="logoutBtn" class="btn red" style="display:none; padding:5px 10px; font-size:12px;" onclick="logout()">התנתק</button>
    </div>
</header>

<div class="container">
    <div id="tabContent">
        <div id="table" class="card">
            <h2>טבלת הליגה</h2>
            <table class="table" id="leagueTable"></table>
        </div>
        <div id="live" class="card" style="display:none">
            <h2>משחקים פעילים</h2>
            <div id="liveMatches"></div>
        </div>
        <div id="feed" class="card" style="display:none">
            <h2>Feed הקהילה</h2>
            <div id="feedInputArea" style="display:none;">
                <textarea id="tweetInput" placeholder="מה קורה בליגה?" style="width:100%; background:rgba(0,0,0,0.2); border:1px solid var(--card-border); border-radius:12px; padding:15px; color:white; margin-bottom:10px; resize:none;"></textarea>
                <button class="btn blue" onclick="postTweet()">פרסם</button>
            </div>
            <div id="feedGuestMsg" style="color:var(--text-muted); text-align:center; padding:20px;">יש להתחבר כדי לכתוב בפיד</div>
            <div id="tweetFeed" style="margin-top:20px;"></div>
        </div>
    </div>

    <div class="card admin" id="adminPanel" style="display:none; border: 2px solid var(--accent);">
        <h2 style="color: var(--accent);">פאנל שליטה אדמין</h2>
        <div class="admin-grid">
            <div class="admin-item">
                <h3>ניהול ניקוד ידני</h3>
                <select id="teamSelect"></select>
                <input type="number" id="pointsUpdate" placeholder="כמות נקודות">
                <button class="btn green" style="width:100%" onclick="updatePoints()">עדכן טבלה</button>
            </div>
            <div class="admin-item">
                <h3>ניהול משחקים (לייב)</h3>
                <div id="adminLiveList" style="margin-bottom:15px; font-size:14px;"></div>
                <hr style="border:0; border-top:1px solid rgba(255,255,255,0.1); margin:10px 0;">
                <h4>הוסף משחק חדש:</h4>
                <input id="homeT" placeholder="קבוצה ביתית">
                <input id="awayT" placeholder="קבוצה אורחת">
                <input id="scoreT" placeholder="0-0">
                <button class="btn blue" style="width:100%" onclick="addLive()">התחל משחק</button>
            </div>
        </div>
    </div>
</div>

<div id="loginModal">
    <div class="modal-content">
        <button style="position:absolute; top:10px; left:10px; background:none; border:none; color:white; cursor:pointer;" onclick="closeLogin()">X</button>
        <h2 id="modalTitle">התחברות</h2>
        <input type="text" id="modalUsername" placeholder="שם משתמש">
        <input type="password" id="modalPassword" placeholder="סיסמה">
        <button class="btn green" id="mainAuthBtn" onclick="handleAuth()">התחבר</button>
        <button class="btn blue" id="switchAuthBtn" onclick="toggleAuthMode()">אין לך חשבון? הירשם עכשיו</button>
        <p id="errorMsg" style="color:var(--danger); font-size:14px; display:none; text-align:center;"></p>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB3WrrW1x_gQn0evkZXj-SkDRGr_uquckc",
  authDomain: "vrfsil-794cd.firebaseapp.com",
  projectId: "vrfsil-794cd",
  storageBucket: "vrfsil-794cd.firebasestorage.app",
  messagingSenderId: "572293379526",
  appId: "1:572293379526:web:16a76f16f7340162666ec7"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let state = { teams: [], live: [], tweets: [], users: [] };
let currentUser = null;
let isLoginMode = true;

onSnapshot(doc(db, "league", "data"), (docSnap) => {
    if (docSnap.exists()) {
        state = docSnap.data();
        renderAll();
    } else {
        initDb();
    }
}, (error) => console.error(error));

async function initDb() {
    const initial = {
        teams: [
            {name:"מכבי פתח תקווה", pts:0}, {name:"הפועל באר שבע", pts:0}, 
            {name:"מ.ס אשדוד", pts:0}, {name:"מכבי באר שבע", pts:0},
            {name:"מכבי תל אביב", pts:0}, {name:"מכבי חיפה", pts:0}, 
            {name:"הפועל תל אביב", pts:0}, {name:"בית'ר ברוקולי", pts:0}
        ],
        live: [],
        tweets: [],
        users: [{username:"ABC", password:"123", isAdmin:true}]
    };
    await setDoc(doc(db, "league", "data"), initial);
}

// Auth Handlers
window.handleAuth = () => isLoginMode ? performLogin() : performRegister();

window.performRegister = async () => {
    const u = document.getElementById("modalUsername").value.trim();
    const p = document.getElementById("modalPassword").value;
    if(!u || !p) return alert("חסרים פרטים");
    if(state.users && state.users.find(x => x.username === u)) return alert("שם תפוס");
    
    try {
        await updateDoc(doc(db, "league", "data"), { users: arrayUnion({username: u, password: p, isAdmin: false}) });
        alert("נרשמת בהצלחה"); toggleAuthMode();
    } catch (e) { alert("שגיאה: " + e.message); }
};

window.performLogin = () => {
    const u = document.getElementById("modalUsername").value;
    const p = document.getElementById("modalPassword").value;
    const user = state.users.find(x => x.username === u && x.password === p);
    if(user) { currentUser = user; closeLogin(); renderAll(); } 
    else { document.getElementById("errorMsg").style.display = 'block'; document.getElementById("errorMsg").innerText = "פרטים שגויים"; }
};

// UI Helpers
window.showTab = (tab) => {
    ["table", "live", "feed"].forEach(t => document.getElementById(t).style.display = "none");
    document.getElementById(tab).style.display = "block";
    document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
    document.getElementById("tab" + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add("active");
};
window.openLogin = () => { document.getElementById("loginModal").style.display = "flex"; };
window.closeLogin = () => { document.getElementById("loginModal").style.display = "none"; document.getElementById("errorMsg").style.display='none'; };
window.toggleAuthMode = () => { isLoginMode = !isLoginMode; document.getElementById("modalTitle").innerText = isLoginMode ? "התחברות" : "הרשמה"; document.getElementById("mainAuthBtn").innerText = isLoginMode ? "התחבר" : "צור חשבון"; document.getElementById("switchAuthBtn").innerText = isLoginMode ? "להרשמה" : "להתחברות"; document.getElementById("errorMsg").style.display = 'none'; };
window.logout = () => { currentUser = null; renderAll(); };

// Game & Data Logic
window.updatePoints = async () => {
    const name = document.getElementById("teamSelect").value;
    const val = parseInt(document.getElementById("pointsUpdate").value) || 0;
    const newTeams = state.teams.map(t => t.name === name ? {...t, pts: t.pts + val} : t);
    await updateDoc(doc(db, "league", "data"), { teams: newTeams });
};

window.addLive = async () => {
    const h = document.getElementById("homeT").value;
    const a = document.getElementById("awayT").value;
    const s = document.getElementById("scoreT").value || "0-0";
    if(h && a) {
        // הוספתי ID ייחודי לכל משחק כדי שנוכל לעדכן אותו ספציפית
        const newMatch = {id: Date.now(), home: h, away: a, score: s};
        await updateDoc(doc(db, "league", "data"), { live: arrayUnion(newMatch) });
        document.getElementById("homeT").value = "";
        document.getElementById("awayT").value = "";
    }
};

// פונקציה לעדכון תוצאה בזמן אמת
window.updateLiveScore = async (id) => {
    const newScore = document.getElementById(`input-score-${id}`).value;
    const newLive = state.live.map(m => {
        if(m.id === id) return {...m, score: newScore};
        return m;
    });
    await updateDoc(doc(db, "league", "data"), { live: newLive });
};

// פונקציה לסיום משחק וחלוקת נקודות
window.endMatch = async (id) => {
    if(!confirm("האם אתה בטוח שברצונך לסיים את המשחק ולעדכן את הטבלה?")) return;

    const match = state.live.find(m => m.id === id);
    if(!match) return;

    // חישוב ניקוד
    const parts = match.score.split('-'); // מניח פורמט "2-1"
    const homeScore = parseInt(parts[0]);
    const awayScore = parseInt(parts[1]);
    
    let homePtsToAdd = 0;
    let awayPtsToAdd = 0;

    if (homeScore > awayScore) { homePtsToAdd = 3; }
    else if (awayScore > homeScore) { awayPtsToAdd = 3; }
    else { homePtsToAdd = 1; awayPtsToAdd = 1; }

    // עדכון הטבלה
    const newTeams = state.teams.map(t => {
        if(t.name === match.home) return {...t, pts: t.pts + homePtsToAdd};
        if(t.name === match.away) return {...t, pts: t.pts + awayPtsToAdd};
        return t;
    });

    // הסרת המשחק מהלייב
    const newLive = state.live.filter(m => m.id !== id);

    // שמירה בבת אחת
    await updateDoc(doc(db, "league", "data"), { 
        teams: newTeams,
        live: newLive 
    });
};

window.deleteLive = async (id) => {
    const newLive = state.live.filter(m => m.id !== id);
    await updateDoc(doc(db, "league", "data"), { live: newLive });
};

window.postTweet = async () => {
    const txt = document.getElementById("tweetInput").value.trim();
    if(!txt) return;
    await updateDoc(doc(db, "league", "data"), { tweets: arrayUnion({text: txt, user: currentUser.username, id: Date.now()}) });
    document.getElementById("tweetInput").value = "";
};

window.deleteTweet = async (tweetId) => {
    // מחיקה לפי ID אם קיים, אחרת לפי טקסט (לתמיכה לאחור)
    const newTweets = state.tweets.filter(t => t.id !== tweetId);
    await updateDoc(doc(db, "league", "data"), { tweets: newTweets });
};


function renderAll() {
    // Render Table
    const sortedTeams = state.teams ? [...state.teams].sort((a,b) => b.pts - a.pts) : [];
    let tableHtml = `<tr><th>מיקום</th><th>קבוצה</th><th>נקודות</th></tr>`;
    sortedTeams.forEach((t, i) => {
        tableHtml += `<tr><td>${i+1}</td><td>${t.name}</td><td style="color:var(--accent); font-weight:bold;">${t.pts}</td></tr>`;
    });
    document.getElementById("leagueTable").innerHTML = tableHtml;
    document.getElementById("teamSelect").innerHTML = sortedTeams.map(t => `<option value="${t.name}">${t.name}</option>`).join('');

    // Render Live
    let liveHtml = (state.live && state.live.length) ? "" : "<p style='text-align:center; opacity:0.5;'>אין משחקים כרגע</p>";
    if(state.live) {
        state.live.forEach(m => {
            liveHtml += `<div style="display:grid; grid-template-columns:1fr auto 1fr; align-items:center; background:rgba(0,0,0,0.2); padding:15px; border-radius:12px; margin-bottom:10px; border:1px solid var(--card-border);">
                <span style="text-align:left">${m.home}</span>
                <span style="background:#000; padding:5px 15px; border-radius:5px; color:var(--accent); margin:0 15px; font-family:monospace;">${m.score}</span>
                <span style="text-align:right">${m.away}</span>
            </div>`;
        });
    }
    document.getElementById("liveMatches").innerHTML = liveHtml;

    // Render Feed
    let feedHtml = "";
    if(state.tweets) {
        [...state.tweets].reverse().forEach((t) => {
            feedHtml += `<div class="tweet-card">
                ${currentUser?.isAdmin ? `<span class="delete-btn" onclick="deleteTweet(${t.id})">מחק 🗑️</span>` : ''}
                <div style="font-weight:bold; color:var(--primary);">${t.user}:</div>
                <div>${t.text}</div>
            </div>`;
        });
    }
    document.getElementById("tweetFeed").innerHTML = feedHtml;

    // Render User/Admin Interface
    if(currentUser) {
        document.getElementById("loginBtn").style.display = "none";
        document.getElementById("loggedUser").style.display = "inline";
        document.getElementById("loggedUser").innerText = "שלום, " + currentUser.username;
        document.getElementById("logoutBtn").style.display = "inline";
        document.getElementById("feedInputArea").style.display = "block";
        document.getElementById("feedGuestMsg").style.display = "none";
        document.getElementById("adminPanel").style.display = currentUser.isAdmin ? 'block' : 'none';
        
        // Admin Live List Control
        let adminLiveHtml = "";
        if(state.live) {
            state.live.forEach((m) => {
                adminLiveHtml += `
                <div class="admin-live-row">
                    <div style="font-weight:bold;">${m.home} נגד ${m.away}</div>
                    <div class="live-controls">
                        <input id="input-score-${m.id}" value="${m.score}" class="score-input">
                        <button class="btn blue small" onclick="updateLiveScore(${m.id})">עדכן</button>
                        <button class="btn green small" onclick="endMatch(${m.id})">סיים (טבלה)</button>
                        <button class="btn red small" onclick="deleteLive(${m.id})">מחק</button>
                    </div>
                </div>`;
            });
        }
        document.getElementById("adminLiveList").innerHTML = adminLiveHtml;
    } else {
        document.getElementById("loginBtn").style.display = "inline";
        document.getElementById("loggedUser").style.display = "none";
        document.getElementById("logoutBtn").style.display = "none";
        document.getElementById("adminPanel").style.display = 'none';
        document.getElementById("feedInputArea").style.display = "none";
        document.getElementById("feedGuestMsg").style.display = "block";
    }
}
</script>
</body>
</html>
