<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VRFSIL | ליגת העל</title>
<style>
:root{
  --bg:#0b1020;
  --panel:#121a33;
  --panel-2:#0e1530;
  --accent:#22c55e;
  --accent-2:#3b82f6;
  --danger:#ef4444;
  --text:#e5e7eb;
  --muted:#9ca3af;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI",Inter,Arial,sans-serif;}
body{background:radial-gradient(1200px 600px at top,#101a3f,#050814);color:var(--text);min-height:100vh;}
header{position:sticky;top:0;z-index:10;background:rgba(5,8,20,.8);backdrop-filter:blur(12px);border-bottom:1px solid #1f2a52;display:flex;justify-content:space-between;align-items:center;padding:16px 20px;flex-wrap:wrap;}
header h1{font-size:22px;margin:0;font-weight:800;letter-spacing:.3px}
nav{display:flex;gap:10px;flex-wrap:wrap;}
nav button{padding:8px 14px;border-radius:12px;border:none;background:#1f2a52;color:#93c5fd;font-weight:700;cursor:pointer;transition:.3s;}
nav button:hover{background:var(--accent-2);color:white;}
nav button.active{background:var(--accent);color:white;}
.container{max-width:1200px;margin:auto;padding:20px;display:flex;flex-direction:column;gap:20px;}
.card{background:linear-gradient(180deg,var(--panel),var(--panel-2));border:1px solid #1f2a52;border-radius:18px;padding:20px;box-shadow:0 30px 60px rgba(0,0,0,.45);transition:.3s;}
.card:hover{transform:translateY(-4px);}
.table-wrap{overflow-x:auto;}
.table{width:100%;border-collapse:collapse;min-width:520px;}
.table th,.table td{padding:14px;text-align:center;}
.table th{font-size:13px;color:#93c5fd;font-weight:700;border-bottom:1px solid #1f2a52;}
.table td{border-bottom:1px solid #1a2347;}
.table tr:hover{background:#0b1435;}
.pos{font-weight:800;}
.points{font-weight:800;color:var(--accent);}
.live-badge{display:inline-flex;align-items:center;gap:6px;color:#22c55e;font-weight:700;}
.live-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 10px #22c55e;}
.match{display:flex;align-items:center;justify-content:space-between;padding:12px 10px;border-radius:12px;background:#0b1435;border:1px solid #1f2a52;margin-bottom:10px;}
.match strong{font-weight:800;}
.score{font-size:18px;font-weight:900;}
.admin{display:none;margin-top:20px;}
.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
input,select,textarea{width:100%;padding:10px 12px;border-radius:12px;background:#070d25;border:1px solid #1f2a52;color:white;transition:.3s;}
input:focus,select:focus,textarea:focus{border-color:var(--accent-2);outline:none;}
textarea{resize:none;}
.btn{padding:12px;border-radius:14px;border:none;cursor:pointer;font-weight:800;margin-top:5px;transition:.3s;}
.btn.green{background:var(--accent);color:#052e16;}
.btn.green:hover{background:#1ed970;}
.btn.blue{background:var(--accent-2);color:white;}
.btn.blue:hover{background:#5aa6ff;}
.btn.red{background:var(--danger);color:white;}
.btn.red:hover{background:#ff5f5f;}
footer{color:#6b7280;text-align:center;padding:30px 10px;font-size:13px;}
#loginModal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.8);justify-content:center;align-items:center;z-index:1000;}
.modal-content{background:var(--panel-2);padding:25px;border-radius:16px;width:350px;max-width:90%;display:flex;flex-direction:column;gap:15px;position:relative;}
.modal-content h2{text-align:center;margin-bottom:10px;}
.closeBtn{background:red;color:white;border:none;border-radius:8px;padding:4px 8px;cursor:pointer;position:absolute;top:10px;right:10px;}
@media(max-width:900px){header h1{font-size:18px;}nav button{padding:6px 10px;font-size:14px;}}
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

<header>
  <h1>VRFSIL</h1>
  <nav>
    <button id="tabTable" class="active" onclick="showTab('table')">טבלה</button>
    <button id="tabLive" onclick="showTab('live')">משחקים חיים</button>
    <button id="tabBet" onclick="showTab('bet')">הימורים</button>
    <button id="tabFeed" onclick="showTab('feed')">Feed (X)</button>
  </nav>
  <button class="btn green" onclick="openLogin()">התחברות</button>
  <span id="loggedUser" style="color:var(--accent);display:none;font-weight:700;"></span>
</header>

<div class="container">
  <div id="tabContent">
    <div id="table" class="card"><h2>טבלת הליגה</h2><div class="table-wrap"><table class="table" id="leagueTable"></table></div></div>
    <div id="live" class="card" style="display:none"><h2><span class="live-badge"><span class="live-dot"></span> משחקים חיים</span></h2><div id="liveMatches"></div></div>
    <div id="bet" class="card" style="display:none"><h2>הימורים</h2><div id="betArea">בחר משחק פעיל קודם להימור</div></div>
    <div id="feed" class="card" style="display:none"><h2>Feed (X)</h2><textarea id="tweetInput" placeholder="כתוב הודעה..." style="width:100%;height:80px;"></textarea><button class="btn blue" onclick="postTweet()">פרסם</button><div id="tweetFeed" style="margin-top:15px;"></div></div>
  </div>
  <div class="card admin" id="adminPanel">
    <h2>פאנל ניהול</h2>
    <div class="admin-grid">
      <div>
        <h3>עדכון נקודות</h3>
        <select id="teamSelect"></select>
        <input type="number" id="points" placeholder="הוסף / הורד נקודות">
        <button class="btn green" onclick="updatePoints()">שמור</button>
      </div>
      <div>
        <h3>משחק חי</h3>
        <input id="home" placeholder="קבוצת בית">
        <input id="away" placeholder="קבוצת חוץ">
        <input id="score" placeholder="0-0">
        <button class="btn blue" onclick="addLive()">הוסף משחק</button>
      </div>
    </div>
  </div>
</div>

<div id="loginModal">
  <div class="modal-content">
    <button class="closeBtn" onclick="closeLogin()">X</button>
    <h2>התחבר / צור משתמש</h2>
    <input type="text" id="modalUsername" placeholder="שם משתמש">
    <input type="password" id="modalPassword" placeholder="סיסמה">
    <button class="btn green" onclick="loginUserModal()">התחבר</button>
    <button class="btn blue" onclick="signupUserModal()">צור משתמש</button>
  </div>
</div>

<footer>© מערכת VRFSIL – ליגת העל</footer>

<script>
// Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyA2E2NgWPWIhzCjHpRDvDtcGIcujjRbn7s",
  authDomain: "vrfsil.firebaseapp.com",
  projectId: "vrfsil",
  storageBucket: "vrfsil.firebasestorage.app",
  messagingSenderId: "231358069626",
  appId: "1:231358069626:web:5987759aec74eccdf374c3",
  measurementId: "G-N25LD9EFB7"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let teams=[
 {name:"מכבי פתח תקווה",pts:0},
 {name:"מכבי נתניה",pts:0},
 {name:"מ.ס אשדוד",pts:0},
 {name:"מכבי באר שבע",pts:0},
 {name:"מכבי תל אביב",pts:0},
 {name:"מכבי חיפה",pts:0},
 {name:"הפועל תל אביב",pts:0},
 {name:"בית'ר ברוקולי",pts:0}
];
let live=[],tweets=[],users=[{username:"ADMINShrek",password:"ShrekKAPLAN",isAdmin:true}];
let currentUser=null;

function renderTable(){
 teams.sort((a,b)=>b.pts-a.pts);
 let html="<tr><th>#</th><th>קבוצה</th><th>נק'</th></tr>";
 teams.forEach((t,i)=>{html+=`<tr><td class='pos'>${i+1}</td><td>${t.name}</td><td class='points'>${t.pts}</td></tr>`;});
 document.getElementById("leagueTable").innerHTML=html;
 document.getElementById("teamSelect").innerHTML=teams.map(t=>`<option>${t.name}</option>`).join('');
}
function renderLive(){let html="";live.forEach(m=>{html+=`<div class='match'><strong>${m.home}</strong><span class='score'>${m.score}</span><strong>${m.away}</strong></div>`});document.getElementById("liveMatches").innerHTML=html;}
function renderTweets(){let html="";tweets.forEach(t=>html+=`<div class="history-item"><b>${t.user}:</b> ${t.text}</div>`);document.getElementById("tweetFeed").innerHTML=html;}

function showTab(tab){["table","live","bet","feed"].forEach(t=>document.getElementById(t).style.display="none");document.getElementById(tab).style.display="block";document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));document.getElementById("tab"+tab.charAt(0).toUpperCase()+tab.slice(1)).classList.add("active");}

function openLogin(){document.getElementById("loginModal").style.display="flex";}
function closeLogin(){document.getElementById("loginModal").style.display="none";}

function loginUserModal(){let u=document.getElementById("modalUsername").value.trim();let p=document.getElementById("modalPassword").value;let user=users.find(x=>x.username===u&&x.password===p);if(user){currentUser=user;closeLogin();document.querySelector('header button[onclick="openLogin()"]').style.display="none";let loggedSpan=document.getElementById("loggedUser");loggedSpan.innerText="מחובר כ-"+u;loggedSpan.style.display="inline";if(user.isAdmin) document.getElementById("adminPanel").style.display='block';alert("שלום "+u+"!");} else alert("שם משתמש או סיסמה לא נכונים");}
function signupUserModal(){let u=document.getElementById("modalUsername").value.trim();let p=document.getElementById("modalPassword").value;if(!u||!p)return alert("מלא שם וסיסמה");if(users.find(x=>x.username===u))return alert("שם משתמש קיים");users.push({username:u,password:p,isAdmin:false});alert("משתמש נוצר בהצלחה");}

function updatePoints(){if(!currentUser?.isAdmin)return alert("אין הרשאה");let t=teams.find(x=>x.name===document.getElementById("teamSelect").value);let pts=Number(document.getElementById("points").value)||0;if(t){t.pts+=pts;renderTable();document.getElementById("points").value="";}}
function addLive(){if(!currentUser?.isAdmin)return alert("אין הרשאה");let h=document.getElementById("home").value,a=document.getElementById("away").value,s=document.getElementById("score").value;if(!h||!a||!s)return;live.push({home:h,away:a,score:s});document.getElementById("home").value=document.getElementById("away").value=document.getElementById("score").value="";renderLive();}

function postTweet(){if(!currentUser)return alert("התחבר קודם");let txt=document.getElementById("tweetInput").value.trim();if(!txt)return;tweets.unshift({text:txt,user:currentUser.username});document.getElementById("tweetInput").value="";renderTweets();}

// טעינה ראשונית
renderTable(); renderLive(); renderTweets();
</script>
</body>
</html>
