<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ליגת העל | מרכז שליטה</title>

<style>
:root{
  --bg:#060a18;
  --panel:#0f1633;
  --panel-2:#0b1128;
  --accent:#22c55e;
  --accent-2:#3b82f6;
  --danger:#ef4444;
  --gold:#facc15;
  --text:#e5e7eb;
  --muted:#94a3b8;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,"Segoe UI",Arial,sans-serif;
  background:radial-gradient(1000px 500px at top,#0f1b4d,#03040a);
  color:var(--text);
}

header{
  position:sticky;top:0;z-index:20;
  background:rgba(6,10,24,.85);
  backdrop-filter:blur(14px);
  border-bottom:1px solid #1e2a55;
}
.header-inner{
  max-width:1200px;margin:auto;padding:14px 20px;
  display:flex;align-items:center;justify-content:space-between
}
header h1{margin:0;font-size:20px;font-weight:900;letter-spacing:.4px}
header h1 span{color:var(--accent)}

.container{max-width:1200px;margin:auto;padding:22px}
.grid{display:grid;grid-template-columns:2.2fr 1fr;gap:22px}

.card{
  background:linear-gradient(180deg,var(--panel),var(--panel-2));
  border:1px solid #1e2a55;
  border-radius:20px;
  padding:22px;
  box-shadow:0 40px 80px rgba(0,0,0,.55);
}
.card h2{margin:0 0 16px;font-size:17px;font-weight:800}

.table-wrap{overflow-x:auto}
.table{width:100%;border-collapse:collapse;min-width:520px}
.table th,.table td{padding:15px 12px;text-align:center}
.table th{
  font-size:12px;letter-spacing:.4px;color:#a5b4fc;
  border-bottom:1px solid #1e2a55
}
.table td{border-bottom:1px solid #141c3f}
.table tr:hover{background:#0b1435}
.pos{font-weight:900;color:#c7d2fe}
.points{font-weight:900;color:var(--accent)}
.champ{color:var(--gold)}

.live-head{display:flex;align-items:center;gap:8px}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}

.match{
  display:grid;grid-template-columns:1fr auto 1fr;
  align-items:center;
  padding:14px;border-radius:14px;
  background:#0b1435;border:1px solid #1e2a55;
  margin-bottom:10px
}
.match strong{text-align:center;font-weight:800}
.score{font-size:20px;font-weight:900;color:#e0f2fe}

.admin-toggle{
  background:#0b1435;border:1px solid #1e2a55;
  color:#a5b4fc;padding:8px 14px;
  border-radius:14px;font-weight:700;cursor:pointer
}

.admin{display:none;margin-top:24px}
.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}

input,select{
  width:100%;padding:12px 14px;border-radius:14px;
  background:#070d25;border:1px solid #1e2a55;
  color:white;font-size:14px
}

.btn{
  padding:13px;border-radius:16px;border:none;
  cursor:pointer;font-weight:900;font-size:14px
}
.btn.green{background:linear-gradient(180deg,#22c55e,#16a34a);color:#052e16}
.btn.blue{background:linear-gradient(180deg,#3b82f6,#2563eb);color:white}

footer{text-align:center;color:#64748b;padding:30px 10px;font-size:13px}

@media(max-width:900px){
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <h1>⚽ ליגת העל <span>Control</span></h1>
    <button class="admin-toggle" onclick="login()">ניהול</button>
  </div>
</header>

<div class="container">

  <div class="grid">

    <div class="card">
      <h2>טבלת הליגה</h2>
      <div class="table-wrap">
        <table class="table" id="leagueTable"></table>
      </div>
    </div>

    <div class="card">
      <h2 class="live-head"><span class="live-dot"></span> משחקים חיים</h2>
      <div id="liveMatches"></div>
    </div>

  </div>

  <div class="card admin" id="adminPanel">
    <h2>פאנל ניהול</h2>
    <div class="admin-grid">
      <div>
        <h3>עדכון נקודות</h3>
        <select id="teamSelect"></select>
        <input type="number" id="points" placeholder="+ / - נקודות">
        <button class="btn green" onclick="updatePoints()">שמור</button>
      </div>
      <div>
        <h3>הוספת משחק חי</h3>
        <input id="home" placeholder="קבוצת בית">
        <input id="away" placeholder="קבוצת חוץ">
        <input id="score" placeholder="0-0">
        <button class="btn blue" onclick="addLive()">הוסף</button>
      </div>
    </div>
  </div>

</div>

<footer>© ליגת העל – מערכת ניהול מקצועית</footer>

<script>
const ADMIN_KEY="admin123";

let teams=[
 {name:"מכבי פתח תקווה",pts:0},
 {name:"מכבי נתניה",pts:0},
 {name:"מ.ס אשדוד",pts:0},
 {name:"מכבי באר שבע",pts:0},
 {name:"מכבי תל אביב",pts:0},
 {name:"מכבי חיפה",pts:0},
 {name:"הפועל תל אביב",pts:0},
 {name:"בית"+"ר ברוקולי",pts:0}
];
let live=[];

function renderTable(){
 teams.sort((a,b)=>b.pts-a.pts);
 let html="<tr><th>#</th><th>קבוצה</th><th>נק'</th></tr>";
 teams.forEach((t,i)=>{
  let cls=i===0?'champ':'';
  html+=`<tr><td class='pos ${cls}'>${i+1}</td><td>${t.name}</td><td class='points'>${t.pts}</td></tr>`;
 });
 leagueTable.innerHTML=html;
 teamSelect.innerHTML=teams.map(t=>`<option>${t.name}</option>`).join('');
}

function updatePoints(){
 let t=teams.find(x=>x.name===teamSelect.value);
 if(t){t.pts+=Number(points.value||0);points.value="";renderTable();}
}

function addLive(){
 live.push({h:home.value,a:away.value,s:score.value});
 home.value=away.value=score.value="";
 renderLive();
}

function renderLive(){
 liveMatches.innerHTML="";
 live.forEach(m=>{
  liveMatches.innerHTML+=`
   <div class='match'>
    <strong>${m.h}</strong>
    <span class='score'>${m.s}</span>
    <strong>${m.a}</strong>
   </div>`;
 });
}

function login(){
 let k=prompt("סיסמת ניהול");
 if(k===ADMIN_KEY){adminPanel.style.display='block'}
}

renderTable();
</script>
</body>
</html>
